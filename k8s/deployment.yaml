apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: student-app
  template:
    metadata:
      labels:
        app: student-app
    spec:
      containers:
        - name: student-container
          image: noussa2026/devopsimage:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8082